spring.application.name=identity-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/identity_service
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Where the generated RSA JWK (with private key material) is persisted locally.
# This directory is gitignored -- never commit it.
identity.keys.path=keys/identity-signing-key.json

identity.jwt.issuer=identity-service
identity.jwt.access-token-ttl-seconds=900
identity.jwt.refresh-token-ttl-seconds=604800
