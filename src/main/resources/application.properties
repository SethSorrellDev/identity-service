spring.application.name=identity-service
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Local dev only: a generated RSA JWK (with private key material) is persisted
# here. This directory is gitignored -- never commit it. In production the key
# comes from IDENTITY_SIGNING_KEY instead (Render's filesystem is ephemeral).
identity.keys.path=keys/identity-signing-key.json
identity.keys.json=${IDENTITY_SIGNING_KEY:}

identity.jwt.issuer=identity-service
identity.jwt.access-token-ttl-seconds=900
identity.jwt.refresh-token-ttl-seconds=604800

identity.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
